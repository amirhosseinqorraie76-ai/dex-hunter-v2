
name: DEX Hunter Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: dex-hunter-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore token memory
        uses: actions/cache@v4
        with:
          path: seen_tokens.json
          key: dex-hunter-memory-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dex-hunter-memory-

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run DEX Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
